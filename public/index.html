<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Work in Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b14;
    color: #f2f2f2;
    font-family: "Press Start 2P", "Courier New", monospace;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 16px; box-sizing: border-box;
    image-rendering: pixelated;
  }
  h1 { font-size: clamp(20px, 6vw, 56px); line-height: 1.5; margin: 0 0 24px; text-shadow: 4px 4px 0 #ff3e8a; }
  p { font-size: clamp(10px, 2vw, 16px); line-height: 2; margin: 0; color: #8be9fd; }
  .cursor { display: inline-block; width: .6em; height: 1em; background: #8be9fd; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <main>
    <h1>WORK IN<br>PROGRESS</h1>
    <p>Portfolio coming soon<span class="cursor"></span></p>
  </main>
</body>
</html>
